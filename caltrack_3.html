<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d10">
<title>CalTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #0d0d10;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  min-height: 100dvh;
}
body { display: flex; justify-content: center; }

.app {
  width: 100%; max-width: 430px;
  min-height: 100dvh;
  padding: 0 0 110px;
  position: relative;
}

/* Header */
.header {
  padding: 16px 20px 0;
  display: flex; justify-content: space-between; align-items: center;
}
.logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo .cal { color: #f0a050; }
.logo .track { color: rgba(255,255,255,0.8); }
.goals-btn {
  background: none; border: none; color: rgba(255,255,255,0.35);
  font-size: 12px; cursor: pointer; padding: 4px 10px;
  border-radius: 6px; font-family: inherit; font-weight: 500;
}
.goals-btn:active { background: rgba(255,255,255,0.06); }

/* Week nav */
.week-nav {
  display: flex; align-items: center; padding: 10px 4px 0;
}
.week-arrow {
  background: none; border: none; color: rgba(255,255,255,0.3);
  font-size: 20px; cursor: pointer; padding: 8px 10px; border-radius: 8px;
  font-family: inherit; line-height: 1; flex-shrink: 0;
}
.week-arrow:active { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); }
.week-arrow.dim { opacity: 0.15; pointer-events: none; }
.week-strip { flex: 1; display: flex; justify-content: space-around; }
.week-day {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; padding: 2px 0; -webkit-tap-highlight-color: transparent;
}
.week-day .label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.3); }
.week-day .label.today-label { color: #f0a050; }
.week-day .num {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.35);
  border: 1px dashed rgba(255,255,255,0.08);
  transition: all 0.15s;
}
.week-day .num.selected {
  background: linear-gradient(135deg, #f0a050, #e8864a);
  color: #fff; font-weight: 700; border-color: transparent;
  box-shadow: 0 2px 12px rgba(240,160,80,0.3);
}
.week-day .num.is-today:not(.selected) {
  border: 1.5px solid rgba(240,160,80,0.5);
  color: #f0a050; font-weight: 600;
}
.week-day .num.has-data:not(.selected):not(.is-today) {
  border-color: rgba(240,160,80,0.22);
}
.week-day .num.future { opacity: 0.2; pointer-events: none; }
.week-day .dot {
  width: 4px; height: 4px; border-radius: 50%; background: transparent;
}
.week-day .dot.filled { background: rgba(240,160,80,0.6); }

/* Date row */
.date-row {
  padding: 10px 20px 4px;
  display: flex; justify-content: space-between; align-items: center;
}
.date-label { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.5); }
.today-btn {
  background: rgba(240,160,80,0.12); border: 1px solid rgba(240,160,80,0.2);
  color: #f0a050; font-size: 11px; font-weight: 600; font-family: inherit;
  padding: 4px 10px; border-radius: 6px; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.today-btn:active { background: rgba(240,160,80,0.2); }

.past-banner {
  margin: 6px 16px 0; padding: 8px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
  font-size: 12px; color: rgba(255,255,255,0.35); text-align: center;
}

/* Main card */
.main-card {
  margin: 8px 16px 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
  border-radius: 20px; padding: 24px;
  border: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: space-between;
  animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
.main-card .cals { font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
.main-card .meta { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,0.35); }
.main-card .meta .goal-num { color: rgba(255,255,255,0.5); }
.main-card .meta .left { font-weight: 600; }
.main-card .meta .left.ok { color: #4ecb71; }
.main-card .meta .left.over { color: #ff6b6b; }

.ring-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
.ring-center { position: absolute; text-align: center; }
.ring-center .val { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.ring-center .lbl { font-size: 9px; color: rgba(255,255,255,0.4); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }

/* Macros */
.macros {
  display: flex; gap: 8px; padding: 10px 16px 0;
  animation: fadeUp 0.5s 0.08s cubic-bezier(0.16,1,0.3,1) both;
}
.macro-card {
  flex: 1; background: rgba(255,255,255,0.03);
  border-radius: 16px; padding: 14px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  border: 1px solid rgba(255,255,255,0.04);
}
.macro-card .val { font-size: 18px; font-weight: 700; }
.macro-card .of { font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 500; }
.macro-card .name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }

/* Stats bar */
.stats-bar {
  display: flex; justify-content: space-around; margin: 14px 16px 0;
  padding: 10px 0;
  border-top: 1px solid rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  animation: fadeUp 0.5s 0.15s cubic-bezier(0.16,1,0.3,1) both;
}
.stat { text-align: center; }
.stat .val { font-size: 16px; font-weight: 700; }
.stat .lbl { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

/* Log section */
.log-section { padding: 16px 16px 0; }
.log-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

.entry {
  background: rgba(255,255,255,0.03);
  border-radius: 14px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  border: 1px solid rgba(255,255,255,0.04);
  margin-bottom: 6px;
  animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) both;
}
.entry-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, rgba(240,160,80,0.15), rgba(255,107,138,0.1));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.entry-info { flex: 1; min-width: 0; }
.entry-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-sub { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 1px; }
.entry-macros { display: flex; gap: 10px; margin-top: 5px; }
.entry-macros span { font-size: 11px; font-weight: 600; }
.entry-macros .p { color: #ff6b8a; }
.entry-macros .c { color: #f0a050; }
.entry-macros .f { color: #60a8fb; }
.entry-macros .v { color: rgba(255,255,255,0.45); margin-left: 2px; }
.entry-right { text-align: right; flex-shrink: 0; }
.entry-cals { font-size: 15px; font-weight: 700; }
.entry-time { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 1px; }
.entry-del {
  background: none; border: none; color: rgba(255,255,255,0.12);
  font-size: 18px; cursor: pointer; padding: 4px; line-height: 1;
}
.entry-del:active { color: #ff6b6b; }

.empty { text-align: center; padding: 32px 0; color: rgba(255,255,255,0.2); }
.empty .icon { font-size: 32px; margin-bottom: 8px; }

/* FAB */
.fab {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  width: 56px; height: 56px; border-radius: 16px;
  background: linear-gradient(135deg, #f0a050, #e8864a);
  border: none; color: #fff; font-size: 30px; font-weight: 300;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 24px rgba(240,160,80,0.35), 0 0 0 1px rgba(255,255,255,0.1) inset;
  z-index: 50; -webkit-tap-highlight-color: transparent;
  transition: opacity 0.25s, transform 0.25s;
}
.fab:active { transform: translateX(-50%) scale(0.92); }
.fab.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) scale(0.7); }

/* Modal */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; padding: 16px;
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 420px;
  background: #1a1a1f; border-radius: 20px; padding: 24px;
  border: 1px solid rgba(255,255,255,0.06);
  transform: translateY(40px); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
}
.overlay.show .modal { transform: translateY(0); }
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.modal h3 button { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 22px; cursor: pointer; padding: 4px; }
.modal label { display: block; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.modal input {
  width: 100%; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  padding: 10px 12px; color: #fff; font-size: 14px;
  font-family: inherit; outline: none; margin-bottom: 12px;
}
.modal input:focus { border-color: rgba(240,160,80,0.4); }
.modal input::placeholder { color: rgba(255,255,255,0.2); }
.macro-inputs { display: flex; gap: 10px; }
.macro-inputs > div { flex: 1; }
.macro-inputs input { text-align: center; }
.modal .lbl-protein { color: #ff6b8a; }
.modal .lbl-carbs { color: #f0a050; }
.modal .lbl-fat { color: #60a8fb; }
.submit-btn {
  width: 100%; padding: 12px; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
  margin-top: 8px; background: linear-gradient(135deg, #f0a050, #e8864a); color: #fff;
}
.submit-btn:active { opacity: 0.85; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ---- ET timezone ----
function getETDate() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
}
function toKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function sameDay(a, b) { return toKey(a) === toKey(b); }

// ---- State ----
const todayET = getETDate();
let selectedDate = new Date(todayET);
let weekOffset = 0;

function loadEntries(key) {
  try { const r = localStorage.getItem('ct_' + key); if (r) return JSON.parse(r); } catch(e) {}
  return [];
}
function saveEntriesFor(key, data) { localStorage.setItem('ct_' + key, JSON.stringify(data)); }
function loadGoals() {
  try { const r = localStorage.getItem('ct_goals'); if (r) return JSON.parse(r); } catch(e) {}
  return { calories: 2309, protein: 168, carbs: 236, fat: 77 };
}
function saveGoals() { localStorage.setItem('ct_goals', JSON.stringify(goals)); }
function hasData(key) {
  try { const r = localStorage.getItem('ct_' + key); if (r) { return JSON.parse(r).length > 0; } } catch(e) {}
  return false;
}

let goals = loadGoals();
function isToday(d) { return sameDay(d, todayET); }
function viewingToday() { return isToday(selectedDate); }
function isFuture(d) { return toKey(d) > toKey(todayET); }

function getTotals(entries) {
  return entries.reduce((a, e) => ({
    calories: a.calories + e.calories, protein: a.protein + e.protein,
    carbs: a.carbs + e.carbs, fat: a.fat + e.fat,
  }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
}

function getWeekDates() {
  const base = addDays(todayET, weekOffset * 7);
  const sun = addDays(base, -base.getDay());
  const labels = ["S","M","T","W","T","F","S"];
  return Array.from({length:7}, (_, i) => {
    const d = addDays(sun, i);
    return { label: labels[i], date: d.getDate(), obj: d, key: toKey(d),
      isToday: isToday(d), isSel: sameDay(d, selectedDate),
      isFut: isFuture(d), hasData: hasData(toKey(d)) };
  });
}

function formatDateLabel(d) {
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}
function timeNow() {
  const d = getETDate(); let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${h}:${m.toString().padStart(2,"0")} ${ap}`;
}
function mealEmoji(c) { return c > 600 ? "🍽️" : c > 300 ? "🥗" : "🥤"; }

// ---- SVG Ring ----
function svgRing(r, s, prog, color, id) {
  const n = r - s, circ = n * 2 * Math.PI;
  const off = circ - (Math.min(prog, 1) * circ);
  const glow = prog > 0.01 ? `filter="url(#g${id})"` : '';
  return `<svg width="${r*2}" height="${r*2}" style="transform:rotate(-90deg)">
    <defs><filter id="g${id}" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="${s}" result="b"/><feFlood flood-color="${color}" flood-opacity="0.25"/>
      <feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>
    <circle cx="${r}" cy="${r}" r="${n}" fill="transparent" stroke="rgba(255,255,255,0.06)" stroke-width="${s}"/>
    <circle cx="${r}" cy="${r}" r="${n}" fill="transparent" stroke="${color}" stroke-width="${s}" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ}" ${glow}>
      <animate attributeName="stroke-dashoffset" from="${circ}" to="${off}" dur="0.8s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" begin="0.05s"/>
    </circle></svg>`;
}

// ---- Nav ----
function selectDay(key) {
  const w = getWeekDates(), f = w.find(d => d.key === key);
  if (f && !f.isFut) { selectedDate = new Date(f.obj); render(); }
}
function prevWeek() { weekOffset--; selectedDate = addDays(selectedDate, -7); render(); }
function nextWeek() {
  if (weekOffset >= 0) return;
  weekOffset++; selectedDate = addDays(selectedDate, 7);
  if (isFuture(selectedDate)) selectedDate = new Date(todayET);
  render();
}
function goToToday() { weekOffset = 0; selectedDate = new Date(todayET); render(); }

// ---- Render ----
function render() {
  const app = document.getElementById('app');
  const week = getWeekDates();
  const entries = loadEntries(toKey(selectedDate));
  const totals = getTotals(entries);
  const rem = Math.max(goals.calories - totals.calories, 0);
  const cp = goals.calories > 0 ? totals.calories / goals.calories : 0;
  const pp = goals.protein > 0 ? totals.protein / goals.protein : 0;
  const carbp = goals.carbs > 0 ? totals.carbs / goals.carbs : 0;
  const fp = goals.fat > 0 ? totals.fat / goals.fat : 0;
  const vt = viewingToday();
  const pct = Math.round(cp * 100);

  let eHTML = '';
  if (!entries.length) {
    const msg = vt ? '<div>No meals logged yet</div><div style="font-size:12px;margin-top:4px">Tap + to add your first meal</div>'
      : '<div>No meals logged this day</div>';
    eHTML = `<div class="empty"><div class="icon">🍽️</div>${msg}</div>`;
  } else {
    entries.forEach((e, i) => {
      eHTML += `<div class="entry" style="animation-delay:${i*0.06}s">
        <div class="entry-icon">${mealEmoji(e.calories)}</div>
        <div class="entry-info">
          <div class="entry-name">${e.name}</div>
          ${e.subtitle ? `<div class="entry-sub">${e.subtitle}</div>` : ''}
          <div class="entry-macros">
            <span><span class="p">P</span><span class="v">${e.protein}g</span></span>
            <span><span class="c">C</span><span class="v">${e.carbs}g</span></span>
            <span><span class="f">F</span><span class="v">${e.fat}g</span></span>
          </div>
        </div>
        <div class="entry-right">
          <div class="entry-cals">${e.calories}</div>
          <div class="entry-time">${e.time}</div>
        </div>
        ${vt ? `<button class="entry-del" onclick="deleteEntry(${e.id})">×</button>` : ''}
      </div>`;
    });
  }

  app.innerHTML = `
    <div class="header">
      <div class="logo"><span class="cal">Cal</span><span class="track">Track</span></div>
      <button class="goals-btn" onclick="openGoals()">⚙ Goals</button>
    </div>

    <div class="week-nav">
      <button class="week-arrow" onclick="prevWeek()">‹</button>
      <div class="week-strip">
        ${week.map(d => `<div class="week-day" onclick="selectDay('${d.key}')">
          <span class="label ${d.isToday?'today-label':''}">${d.label}</span>
          <div class="num ${d.isSel?'selected':''} ${d.isToday&&!d.isSel?'is-today':''} ${d.hasData&&!d.isSel&&!d.isToday?'has-data':''} ${d.isFut?'future':''}">${d.date}</div>
          <div class="dot ${d.hasData&&!d.isSel?'filled':''}"></div>
        </div>`).join('')}
      </div>
      <button class="week-arrow ${weekOffset>=0?'dim':''}" onclick="nextWeek()">›</button>
    </div>

    <div class="date-row">
      <div class="date-label">${formatDateLabel(selectedDate)}</div>
      ${!vt ? `<button class="today-btn" onclick="goToToday()">Go to Today</button>` : ''}
    </div>

    ${!vt ? '<div class="past-banner">Viewing past day · read only</div>' : ''}

    <div class="main-card">
      <div>
        <div class="cals">${totals.calories.toLocaleString()}</div>
        <div class="meta">
          <span class="goal-num">${goals.calories.toLocaleString()}</span> goal
          <span style="margin:0 6px;opacity:0.3">·</span>
          <span class="left ${rem > 0 ? 'ok' : 'over'}">${rem > 0 ? rem+' left' : 'Goal hit!'}</span>
        </div>
      </div>
      <div class="ring-wrap">
        ${svgRing(72, 8, cp, cp > 1 ? '#ff4757' : '#f0a050', 'cal')}
        <div class="ring-center">
          <div class="val">${totals.calories}</div>
          <div class="lbl">eaten</div>
        </div>
      </div>
    </div>

    <div class="macros">
      <div class="macro-card">
        <div class="ring-wrap">${svgRing(28,5,pp,'#ff6b8a','p')}</div>
        <div style="text-align:center">
          <div class="val" style="color:${totals.protein>goals.protein?'#ff6b6b':'#fff'}">${totals.protein}g</div>
          <div class="of">/ ${goals.protein}g</div>
          <div class="name" style="color:#ff6b8a">Protein</div>
        </div>
      </div>
      <div class="macro-card">
        <div class="ring-wrap">${svgRing(28,5,carbp,'#f0a050','c')}</div>
        <div style="text-align:center">
          <div class="val" style="color:${totals.carbs>goals.carbs?'#ff6b6b':'#fff'}">${totals.carbs}g</div>
          <div class="of">/ ${goals.carbs}g</div>
          <div class="name" style="color:#f0a050">Carbs</div>
        </div>
      </div>
      <div class="macro-card">
        <div class="ring-wrap">${svgRing(28,5,fp,'#60a8fb','f')}</div>
        <div style="text-align:center">
          <div class="val" style="color:${totals.fat>goals.fat?'#ff6b6b':'#fff'}">${totals.fat}g</div>
          <div class="of">/ ${goals.fat}g</div>
          <div class="name" style="color:#60a8fb">Fat</div>
        </div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat"><div class="val">${entries.length}</div><div class="lbl">Meals</div></div>
      <div class="stat"><div class="val">${entries.length?Math.round(totals.calories/entries.length):0}</div><div class="lbl">Avg/meal</div></div>
      <div class="stat"><div class="val">${pct}%</div><div class="lbl">of goal</div></div>
    </div>

    <div class="log-section">
      <div class="log-title">${vt ? "Today's Log" : formatDateLabel(selectedDate)}</div>
      ${eHTML}
    </div>

    <button class="fab ${vt?'':'hidden'}" onclick="openAdd()">+</button>

    <div class="overlay" id="add-modal">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Log Meal <button onclick="closeAdd()">×</button></h3>
        <label>What did you eat?</label>
        <input id="meal-name" placeholder="e.g. Grilled chicken bowl">
        <label>Calories</label>
        <input id="meal-cals" placeholder="0" inputmode="numeric">
        <div class="macro-inputs">
          <div><label class="lbl-protein">Protein</label><input id="meal-p" placeholder="0g" inputmode="numeric"></div>
          <div><label class="lbl-carbs">Carbs</label><input id="meal-c" placeholder="0g" inputmode="numeric"></div>
          <div><label class="lbl-fat">Fat</label><input id="meal-f" placeholder="0g" inputmode="numeric"></div>
        </div>
        <button class="submit-btn" onclick="submitMeal()">Add Entry</button>
      </div>
    </div>

    <div class="overlay" id="goals-modal">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Edit Goals <button onclick="closeGoals()">×</button></h3>
        <label>Daily Calories</label>
        <input id="goal-cals" value="${goals.calories}" inputmode="numeric">
        <div class="macro-inputs">
          <div><label class="lbl-protein">Protein (g)</label><input id="goal-p" value="${goals.protein}" inputmode="numeric"></div>
          <div><label class="lbl-carbs">Carbs (g)</label><input id="goal-c" value="${goals.carbs}" inputmode="numeric"></div>
          <div><label class="lbl-fat">Fat (g)</label><input id="goal-f" value="${goals.fat}" inputmode="numeric"></div>
        </div>
        <button class="submit-btn" onclick="submitGoals()">Save Goals</button>
      </div>
    </div>`;

  document.getElementById('add-modal').onclick = closeAdd;
  document.getElementById('goals-modal').onclick = closeGoals;
}

// ---- Actions ----
function openAdd() {
  if (!viewingToday()) return;
  render();
  setTimeout(() => document.getElementById('add-modal').classList.add('show'), 10);
  setTimeout(() => document.getElementById('meal-name')?.focus(), 350);
}
function closeAdd() { document.getElementById('add-modal')?.classList.remove('show'); }
function submitMeal() {
  const name = document.getElementById('meal-name').value.trim();
  const cals = parseInt(document.getElementById('meal-cals').value) || 0;
  if (!name || !cals) return;
  const key = toKey(todayET);
  const entries = loadEntries(key);
  entries.unshift({
    id: Date.now(), name, subtitle: '', calories: cals,
    protein: parseInt(document.getElementById('meal-p').value) || 0,
    carbs: parseInt(document.getElementById('meal-c').value) || 0,
    fat: parseInt(document.getElementById('meal-f').value) || 0,
    time: timeNow(),
  });
  saveEntriesFor(key, entries);
  closeAdd();
  setTimeout(render, 260);
}
function deleteEntry(id) {
  const key = toKey(todayET);
  saveEntriesFor(key, loadEntries(key).filter(e => e.id !== id));
  render();
}
function openGoals() {
  render();
  setTimeout(() => document.getElementById('goals-modal').classList.add('show'), 10);
}
function closeGoals() { document.getElementById('goals-modal')?.classList.remove('show'); }
function submitGoals() {
  goals = {
    calories: parseInt(document.getElementById('goal-cals').value) || 2000,
    protein: parseInt(document.getElementById('goal-p').value) || 150,
    carbs: parseInt(document.getElementById('goal-c').value) || 200,
    fat: parseInt(document.getElementById('goal-f').value) || 70,
  };
  saveGoals(); closeGoals(); setTimeout(render, 260);
}

render();
</script>
</body>
</html>
